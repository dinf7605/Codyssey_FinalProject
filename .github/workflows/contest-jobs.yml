name: Contest jobs

on:
  schedule:
    - cron: '0 20 * * *'   # 05:00 Asia/Seoul
    - cron: '0 0 * * 1'    # Monday 09:00 Asia/Seoul
  workflow_dispatch:
    inputs:
      job:
        description: 'collect or recommend'
        type: choice
        options: [collect, recommend]
        required: true

jobs:
  collect:
    if: vars.CONTEST_COLLECTION_ENABLED == 'true' && (github.event.schedule == '0 20 * * *' || inputs.job == 'collect')
    runs-on: ubuntu-latest
    steps:
      - name: Collect permitted public links
        env:
          API_BASE: ${{ secrets.STUDYPACE_API_BASE }}
          BATCH_KEY: ${{ secrets.BATCH_SECRET }}
        run: |
          if [ -z "$API_BASE" ] || [ -z "$BATCH_KEY" ]; then
            echo 'Batch API URL or key is not configured.' >&2
            exit 1
          fi
          status=$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' \
            --request POST --header "X-Batch-Key: $BATCH_KEY" \
            "${API_BASE%/}/contests/collect")
          echo "POST /contests/collect -> $status"
          # 202 시작함 · 409 이미 실행 중. 그 밖(200 포함)은 실패 — 주소가 프론트를 가리키면 HTML 200 이 온다
          if [ "$status" != "202" ] && [ "$status" != "409" ]; then
            exit 1
          fi

  recommend:
    if: vars.CONTEST_RECOMMENDATIONS_ENABLED == 'true' && (github.event.schedule == '0 0 * * 1' || inputs.job == 'recommend')
    runs-on: ubuntu-latest
    steps:
      - name: Prepare weekly recommendations
        env:
          API_BASE: ${{ secrets.STUDYPACE_API_BASE }}
          BATCH_KEY: ${{ secrets.BATCH_SECRET }}
        run: |
          if [ -z "$API_BASE" ] || [ -z "$BATCH_KEY" ]; then
            echo 'Batch API URL or key is not configured.' >&2
            exit 1
          fi
          status=$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' \
            --request POST --header "X-Batch-Key: $BATCH_KEY" \
            "${API_BASE%/}/contests/recommend-weekly")
          echo "POST /contests/recommend-weekly -> $status"
          if [ "$status" != "202" ] && [ "$status" != "409" ]; then
            exit 1
          fi
